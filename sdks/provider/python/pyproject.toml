[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mppi-provider"
version = "0.1.3"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "MPPI provider SDK: typed payment interfaces and exact primitives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mppi-protocol==0.1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/mppi_provider"]
